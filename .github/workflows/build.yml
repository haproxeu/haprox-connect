name: Build und veröffentlichen

# Multi-Arch-Images (aarch64, amd64) bauen und in
# die GitHub Container Registry schieben. Monatlicher Rebuild ist
# Pflicht, auch ohne Codeänderung -- ein Add-on aus einem Repository,
# das jahrelang nicht neu gebaut wird, liefert veraltete Bibliotheken
# aus dem Basis-Image an fremde Systeme aus.

on:
  push:
    branches: [master]
    paths:
      - "haprox_connect/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 1 * *" # 1. jedes Monats, 03:00 UTC -- Pflicht-Rebuild
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            # Echter arm64-Runner statt QEMU-Emulation auf x86 -- kostenlos
            # fuer oeffentliche Repos, seit August 2025 GA. QEMU-Emulation
            # war der groesste Zeitfresser, gerade bei `go install lego`
            # (rechenintensiv, unter Emulation vielfach langsamer).
            runner: ubuntu-24.04-arm

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Version aus config.yaml lesen
        id: version
        run: |
          VERSION=$(grep '^version:' haprox_connect/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Basis-Image fuer ${{ matrix.arch }} aus build.yaml lesen
        id: base
        run: |
          BASE=$(grep "^  ${{ matrix.arch }}:" haprox_connect/build.yaml | sed -E 's/^[^:]+: *//')
          if [ -z "$BASE" ]; then
            echo "Kein Basis-Image fuer ${{ matrix.arch }} in build.yaml gefunden" >&2
            exit 1
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und schieben
        uses: docker/build-push-action@v7
        with:
          context: haprox_connect
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.arch }}:latest
          # Layer-Cache pro Architektur getrennt (scope), sonst ueberschreiben
          # sich amd64/aarch64 gegenseitig den Cache. Unveraenderte Layer
          # (Basis-Image, apk add, der ganze go-install-lego-Schritt) werden
          # dann wiederverwendet statt bei jedem Lauf neu gebaut zu werden --
          # bei einer Aenderung, die nur ein rootfs-Skript betrifft, sind das
          # praktisch alle Layer bis auf den letzten COPY-Schritt.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
