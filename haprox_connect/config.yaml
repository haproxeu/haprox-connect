name: haprox connect
version: "0.4.7"
slug: haprox_connect
description: Verbindet diese Home-Assistant-Instanz per WireGuard mit haprox.eu
url: "https://github.com/haproxeu/haprox-connect"
# Von der CI gebaute Multi-Arch-Images (.github/workflows/build.yml) --
# Supervisor zieht das fertige Image statt es lokal auf der Box zu
# bauen. Pfad muss exakt zu github.repository im Workflow passen
# (ghcr.io/<owner>/<repo>/<arch>).
image: "ghcr.io/haproxeu/haprox-connect/{arch}"
arch:
  - aarch64
  - amd64
init: false

# Braucht Netzwerkzugriff wie der Host, damit das WireGuard-Interface
# (wghaprox) routbar ist -- kein eigenes Docker-Netz-Namespace.
host_network: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun

# Fuer Supervisor-API-Zugriff: ha_version lesen, eigene Optionen nach
# erfolgreichem Enrollment aendern (enrollment_token loeschen). Dieselbe
# Berechtigung wird auch fuer die Statusentitaeten gebraucht.
hassio_api: true
homeassistant_api: true

# enrollment_token ist das einzige Pflichtfeld, sichtbar. enroll_url/
# heartbeat_interval sind ueberschreibbar, aber hinter "Erweitert"
# versteckt -- das "?"-Suffix im Schema ist der HA-Mechanismus dafuer
# ("Zeige unbenutzte optionale Konfigurationsoptionen").
options:
  enrollment_token: ""
  enroll_url: "https://enroll.haprox.eu"
  heartbeat_interval: 300
schema:
  enrollment_token: str
  enroll_url: url?
  heartbeat_interval: int(30,3600)?
